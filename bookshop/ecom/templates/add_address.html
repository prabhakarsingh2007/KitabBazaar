{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
    <div class="w-full max-w-2xl mx-auto mt-10">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-slate-800">Add New Address</h2>
                <p class="text-sm text-slate-500 mt-1">Save a shipping address for faster checkout.</p>
            </div>
            <form action="{% url 'add_address' %}" method="post" class="space-y-5 ui-form">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="w-full bg-brand-500 text-white py-3 rounded-xl font-semibold hover:bg-brand-600 transition shadow-sm">
                    Save Address
                </button>
            </form>
        </div>
    </div>
{% endblock %}
