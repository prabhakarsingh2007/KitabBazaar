<header class="flex items-center justify-between px-8 py-4 bg-white border-b border-slate-200 shadow-sm">
    <div class="flex items-center gap-3">
        <div class="bg-indigo-600 text-white p-2 rounded-lg">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
            </svg>
        </div>
        <a href="{% url 'admin_index' %}" class="text-lg font-bold text-slate-800 tracking-tight">KitabBazaar <span class="text-indigo-600 font-semibold">Admin</span></a>
    </div>
    
    <div class="flex items-center gap-4">
        <!-- View Site Link -->
        <a href="{% url 'home' %}" class="text-sm font-medium text-slate-600 hover:text-indigo-600 transition flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
            </svg>
            <span>View Shop</span>
        </a>
        <div class="h-4 w-px bg-slate-200"></div>
        <!-- Admin Profile -->
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-full bg-indigo-100 border border-indigo-200 text-indigo-700 flex items-center justify-center font-bold text-sm uppercase">
                {{ request.user.username|slice:":2" }}
            </div>
            <div class="hidden md:block text-left">
                <p class="text-xs text-slate-400 font-medium leading-none">Administrator</p>
                <p class="text-sm font-semibold text-slate-700 mt-0.5 leading-none">{{ request.user.username }}</p>
            </div>
        </div>
    </div>
</header>
