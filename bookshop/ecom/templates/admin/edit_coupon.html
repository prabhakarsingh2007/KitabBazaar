{% extends "admin/admin_base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="flex flex-1 p-5">
    <div class="w-full max-w-3xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <h2 class="text-2xl font-bold text-slate-800">Edit Coupon</h2>
        <p class="text-sm text-slate-500 mt-1 mb-6">Update coupon code, amount, dates, and status.</p>

        <form action="" method="post" class="space-y-5 ui-form">
            {% csrf_token %}
            {{ form|crispy }}

            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl font-semibold transition">
                Update Coupon
            </button>
        </form>
    </div>
</div>

{% endblock content %}
