{% extends 'auth/authbase.html' %}
{% load crispy_forms_tags %}

{% block auth_content %}
<div class="min-h-[70vh] flex items-center justify-center">
    <div class="w-full max-w-md bg-white rounded-lg shadow-sm p-6">
        <h2 class="text-2xl font-bold text-slate-800 mb-4">Sign in to your account</h2>
        <form action="" method="post">{% csrf_token %}
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
            {{ form|crispy }}

            <div class="flex items-center justify-between mt-4">
                <button type="submit" class="bg-brand-500 text-white px-4 py-2 rounded">Login</button>
                <a href="{% url 'register' %}" class="text-sm text-slate-500">Create account</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
