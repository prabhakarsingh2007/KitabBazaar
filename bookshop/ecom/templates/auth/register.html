{% extends 'auth/authbase.html' %}
{% load crispy_forms_tags %}

{% block auth_content %}
<div class="min-h-[70vh] flex items-center justify-center">
    <div class="w-full max-w-md bg-white rounded-lg shadow-sm p-6">
        <h2 class="text-2xl font-bold text-slate-800 mb-4">Create your account</h2>
        <form action="" method="post">{% csrf_token %}
            {{ form|crispy }}
            <div class="mt-4">
                <button type="submit" class="w-full bg-brand-500 text-white py-2 rounded">Register</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
