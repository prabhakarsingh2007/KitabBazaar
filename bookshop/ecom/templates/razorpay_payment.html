{% extends "base.html" %}

{% block title %}Complete Payment - KitabBazaar{% endblock %}

{% block content %}
<!-- Metadata store to pass variables cleanly to JavaScript without linter syntax diagnostics -->
<div id="payment-metadata" 
     class="hidden"
     data-key="{{ razorpay_key_id }}"
     data-amount="{{ razorpay_amount }}"
     data-order-id="{{ order.id }}"
     data-razorpay-order-id="{{ razorpay_order_id }}"
     data-verify-url="{% url 'verify_payment' %}"
     data-user-name="{{ user_name }}"
     data-user-email="{{ user_email }}"
     data-contact-number="{{ contact_number }}"
     data-cancel-url="{% url 'cancel_payment' order.id %}"
     data-failed-url="{% url 'payment_failed' order.id %}">
</div>

<!-- Minimalist Full-Screen Loader -->
<div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex flex-col items-center justify-center p-4">
    <div class="w-16 h-16 bg-purple-50 rounded-full flex items-center justify-center mb-4 border border-purple-100 animate-pulse">
        <svg class="w-8 h-8 text-purple-600 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
    </div>
    <h3 class="text-lg font-bold text-white">Opening Payment Gateway...</h3>
    <p class="text-xs text-purple-200 mt-1 max-w-xs text-center">Connecting to Razorpay secure checkout. Please do not refresh or close this window.</p>
</div>

<!-- Razorpay Integration Scripts -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
    (function() {
        const metadata = document.getElementById("payment-metadata");
        if (!metadata) return;

        const options = {
            "key": metadata.dataset.key,
            "amount": metadata.dataset.amount,
            "currency": "INR",
            "name": "KitabBazaar",
            "description": "Secure Payment for Order #" + metadata.dataset.orderId,
            "order_id": metadata.dataset.razorpayOrderId,
            "callback_url": window.location.origin + metadata.dataset.verifyUrl + "?order_id=" + metadata.dataset.orderId,
            "redirect": true,
            "prefill": {
                "name": metadata.dataset.userName,
                "email": metadata.dataset.userEmail,
                "contact": metadata.dataset.contactNumber,
                "method": "upi"
            },
            "theme": {
                "color": "#6d28d9"
            },
            "modal": {
                "ondismiss": function() {
                    window.location.href = metadata.dataset.cancelUrl;
                }
            }
        };
        const rzp1 = new Razorpay(options);
        
        rzp1.on('payment.failed', function (response){
            window.location.href = metadata.dataset.failedUrl + "?error_description=" + encodeURIComponent(response.error.description);
        });

        // Auto trigger the checkout modal on load
        window.onload = function() {
            rzp1.open();
        };
    })();
</script>
{% endblock %}
